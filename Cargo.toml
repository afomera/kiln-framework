[workspace]
resolver = "3"
members = ["crates/kiln", "crates/kiln-cli", "crates/kiln-macros", "examples/blog"]

[workspace.package]
edition = "2024"
version = "0.0.4"
license = "MIT OR Apache-2.0"
rust-version = "1.99"
repository = "https://github.com/afomera/kiln-framework"

[workspace.dependencies]
# Versions as well as paths: crates.io resolves the version, the workspace the path.
kiln = { path = "crates/kiln", package = "kiln-framework", version = "0.0.4" }
kiln-macros = { path = "crates/kiln-macros", package = "kiln-framework-macros", version = "0.0.4" }
axum = "0.8"
inventory = "0.3"
jiff = "0.2"
minijinja = { version = "2", features = ["loader"] }
percent-encoding = "2"
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "any"] }
syn = { version = "2", features = ["full"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = "0.3"
trybuild = "1"
serde_json = "1"
serde_urlencoded = "0.7"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
chacha20poly1305 = "0.10"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname"] }
argon2 = "0.5"
ammonia = "4"
comrak = { version = "0.56", default-features = false }
# Pure-Rust regexes (no oniguruma C build); colors come from Kiln's CSS, not syntect themes.
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "html", "regex-fancy"] }
object_store = { version = "0.14", default-features = false, features = ["aws", "gcp", "fs"] }
multer = "3"
bytes = "1"
# Outbound HTTP (webhooks): already in the tree through object_store, so no second stack.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
toml = "1"

# Debug builds keep file:line backtraces but not full debuginfo, and none for
# dependencies: most of target/ was debuginfo object files.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Release binaries without their symbol table: about 20% smaller. Panic messages keep
# their file and line; backtraces show addresses instead of function names.
[profile.release]
strip = true

# Password hashing is slow without optimizations.
[profile.dev.package.argon2]
opt-level = 3

# Image variants resize in-process; unoptimized, a large image takes seconds.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.zune-core]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.gif]
opt-level = 3

[profile.dev.package.weezl]
opt-level = 3

# Highlighting is regex-bound: unoptimized, a 400 KB file takes seconds.
[profile.dev.package.syntect]
opt-level = 3

[profile.dev.package.fancy-regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3
