[package]
name = "@@app@@"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
kiln = { path = "@@kiln_path@@" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tracing-subscriber = "0.3"

# Backtraces keep file:line; full debuginfo (and any for dependencies) mostly fills target/.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Release binaries without their symbol table: about 20% smaller. Panic messages keep
# their file and line; backtraces show addresses instead of function names.
[profile.release]
strip = true

# Password hashing is slow without optimizations.
[profile.dev.package.argon2]
opt-level = 3

# Image variants resize in-process; unoptimized, a large image takes seconds.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.zune-core]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.gif]
opt-level = 3

[profile.dev.package.weezl]
opt-level = 3

# A standalone app, even when created inside another Cargo workspace.
[workspace]
