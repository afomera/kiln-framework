[package]
name = "kiln-framework-cli"
description = "The kiln command for Kiln (kiln-framework): generators, schema workflow, checks and deploys."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["web", "framework", "cli", "generator", "agents"]
categories = ["web-programming", "command-line-utilities", "development-tools"]

[[bin]]
name = "kiln"
path = "src/main.rs"

[dependencies]
clap.workspace = true
proc-macro2 = { workspace = true, features = ["span-locations"] }
quote.workspace = true
serde_json.workspace = true
toml.workspace = true
syn = { workspace = true, features = ["visit"] }
ctrlc = { version = "3", features = ["termination"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
portable-pty = "0.9"
libc = "0.2"
unicode-width = "0.2"

[dev-dependencies]
minijinja.workspace = true
